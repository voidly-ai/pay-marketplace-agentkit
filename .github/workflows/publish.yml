name: Publish AgentKit provider with provenance

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: agentkit-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.repository == 'voidly-ai/pay-marketplace-agentkit' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release identity and version absence
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const name = '@voidly/pay-marketplace-agentkit';
          const repository = 'https://github.com/voidly-ai/pay-marketplace-agentkit';
          if (process.env.GITHUB_REPOSITORY !== 'voidly-ai/pay-marketplace-agentkit') {
            throw new Error('Unexpected GitHub repository');
          }
          if (pkg.name !== name || pkg.repository?.type !== 'git' ||
              pkg.repository?.url !== repository || pkg.publishConfig?.access !== 'public') {
            throw new Error('npm package, repository or access identity mismatch');
          }
          if (lock.name !== name || lock.version !== pkg.version ||
              lock.packages?.['']?.name !== name || lock.packages?.['']?.version !== pkg.version) {
            throw new Error('Lockfile identity or version mismatch');
          }
          if (process.env.RELEASE_TAG !== `v${pkg.version}`) {
            throw new Error('Tag must exactly match package version');
          }
          const url = `https://registry.npmjs.org/@voidly%2fpay-marketplace-agentkit/${encodeURIComponent(pkg.version)}`;
          const response = await fetch(url, {
            headers: { accept: 'application/json' },
            signal: AbortSignal.timeout(10_000),
          });
          await response.body?.cancel();
          if (response.status === 200) throw new Error('Exact npm version already exists');
          if (response.status !== 404) {
            throw new Error(`Cannot verify exact npm version absence: HTTP ${response.status}`);
          }
          NODE
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test and audit packed tarball
        run: npm run audit:pack
      - name: Publish by npm trusted publisher with provenance
        run: npm publish --provenance --access public
